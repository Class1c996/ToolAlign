name: ci

on:
  push:
  pull_request:

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Run deterministic unit tests
        run: python -m pytest -q
      - name: Run public reproduction smoke suite
        run: python scripts/reproduce.py --suite public_smoke
      - name: Audit public release contents
        run: python scripts/check_public_release.py
